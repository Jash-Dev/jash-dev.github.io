<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1D2E3D; --panel:#FAF8F4; --panel-2:#EDE8DF; --ink:#17222D;
    --muted:#6B7A88; --line:#DAD3C7;
    --teal:#2E8B80; --teal-soft:#D8EDE9;
    --amber:#DDA02B; --amber-soft:#FBEBCB; --coral:#D3654A;
    --r:1rem;
  }
  html{ font-size:clamp(13px, 0.6vw + 1.0vh, 26px); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  .page{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.7rem;padding:2.5vh 2.2vw}

  .top{background:var(--panel);border-radius:var(--r);display:grid;
    grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;padding:.5rem 1rem}
  .month{font-family:'Fredoka',sans-serif;font-weight:600;font-size:2.5rem;margin:0;
    line-height:1.05;text-align:center}
  .nav{display:flex;gap:.4rem;align-items:center}
  .nbtn{font-family:'Fredoka',sans-serif;font-size:1.6rem;font-weight:600;color:var(--ink);
    background:var(--panel-2);border:none;border-radius:.7rem;cursor:pointer;
    width:3rem;height:3rem;display:grid;place-items:center;line-height:1}
  .nbtn:hover{background:#E2DCD1}
  .nbtn.today{width:auto;padding:0 1.1em;font-size:1.15rem}
  .tbtn{font-family:inherit;font-size:.95rem;font-weight:700;color:var(--muted);
    background:var(--panel-2);border:none;border-radius:999px;padding:.45em 1em;cursor:pointer;
    display:inline-flex;align-items:center;gap:.4em}
  .tbtn svg{width:1.1em;height:1.1em;fill:currentColor}

  .cal{background:var(--panel);border-radius:var(--r);padding:.6rem .7rem .8rem;
    display:grid;grid-template-rows:auto minmax(0,1fr);gap:.4rem;min-height:0}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
  .dow span{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;color:var(--muted);
    text-align:center;padding:.1rem 0}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;min-height:0}
  .cell{
    background:var(--panel-2);border:none;border-radius:.6rem;cursor:pointer;
    display:flex;flex-direction:column;align-items:stretch;gap:.1rem;
    padding:.35rem .4rem;text-align:left;min-width:0;overflow:hidden;
    font-family:inherit;color:var(--ink);
  }
  .cell:hover{background:#E4DED3}
  .cell:active{transform:translateY(.1rem)}
  .cell:focus-visible{outline:.18rem solid var(--teal);outline-offset:.1rem}
  .cell.blank{background:transparent;cursor:default}
  .cell.weekend{background:#E7E3DC;color:var(--muted)}
  .cell.closed{background:var(--amber-soft)}
  .cell.today{box-shadow:inset 0 0 0 .22rem var(--teal);background:var(--teal-soft)}
  .cell .dnum{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.5rem;line-height:1.05}
  .cell.today .dnum{color:#1D6259}
  .cell .tag{font-size:.78rem;font-weight:800;color:#8A6210;line-height:1.15;overflow-wrap:anywhere}
  .cell .meal{
    font-size:.78rem;font-weight:700;color:var(--muted);line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cell .pip{font-size:.9rem;line-height:1}

  /* ---------- day card ---------- */
  .modal{position:fixed;inset:0;z-index:30;background:rgba(16,26,36,.74);
    display:flex;align-items:center;justify-content:center;padding:5vh 5vw;cursor:pointer}
  .modal[hidden]{display:none}
  .mcard{background:var(--panel);border-radius:1.2rem;border-bottom:.3rem solid var(--line);
    padding:1.3rem 2.4rem 1.1rem;text-align:center;max-width:min(52rem,92vw);max-height:88vh;
    overflow:auto;box-shadow:0 1.2rem 3rem rgba(0,0,0,.45)}
  .mday{font-family:'Fredoka',sans-serif;font-weight:600;font-size:2.8rem;line-height:1.05;margin:0}
  .mdate{font-size:1.4rem;font-weight:700;color:var(--muted);margin:.1em 0 .7em}
  .mclosed{font-family:'Fredoka',sans-serif;font-weight:600;font-size:2rem;color:#8A6210;
    background:var(--amber-soft);border-radius:.7rem;padding:.4em 1em;display:inline-block;margin-bottom:.5em}
  .mlabel{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.5rem;margin:.2em 0 .5em;
    display:flex;align-items:center;justify-content:center;gap:.5rem}
  .mlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:.4rem}
  .mlist.two{grid-template-columns:1fr 1fr;gap:.35rem .6rem}
  .mlist.dense li{font-size:1.5rem}
  .mlist li{font-family:'Fredoka',sans-serif;font-weight:500;font-size:2rem;line-height:1.15;
    color:var(--ink);background:var(--panel-2);border-radius:.6rem;padding:.35em .7em;
    display:flex;align-items:baseline;gap:.6em;text-align:left}
  .mlist li::before{content:"";flex:0 0 auto;width:.42em;height:.42em;border-radius:50%;
    background:var(--teal);transform:translateY(-.15em)}
  .mnone{font-size:1.3rem;font-weight:700;color:var(--muted)}
  .mhint{display:block;margin-top:1rem;font-size:1rem;font-weight:700;color:var(--muted)}

  .status{position:fixed;left:.6rem;bottom:.35rem;z-index:9;font-size:.62rem;font-weight:700;
    color:rgba(255,255,255,.55);opacity:.3;pointer-events:none;max-width:80vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body:hover .status{opacity:.75}
  .status.warn{color:#2A1D06;background:var(--amber);opacity:1;
    font-size:.85rem;padding:.3em .8em;border-radius:.4rem}

  .wake{position:fixed;left:50%;bottom:2.2rem;transform:translateX(-50%);z-index:40;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;background:var(--amber);
    color:#2A1D06;border:none;border-radius:999px;padding:.45em 1.3em;cursor:pointer;
    box-shadow:0 .3rem .9rem rgba(0,0,0,.35)}
  .wake[hidden]{display:none}

  @media (max-width:820px), (orientation:portrait){
    body{overflow:auto}
    .page{height:auto;min-height:100dvh}
    .cell{min-height:4.5rem}
    .cell .meal{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="page">
  <header class="top">
    <div class="nav">
      <button class="nbtn" id="prev" aria-label="Previous month">&#8249;</button>
      <button class="nbtn" id="next" aria-label="Next month">&#8250;</button>
      <button class="nbtn today" id="todayBtn">Today</button>
    </div>
    <h1 class="month" id="monthName">—</h1>
    <button class="tbtn" id="soundBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" id="soundIcon"></svg><span id="soundLabel">Sound on</span>
    </button>
  </header>

  <main class="cal">
    <div class="dow" id="dow"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<button class="wake" id="wake" hidden>Tap anywhere to turn on sound</button>
<div class="status" id="status"></div>

<div class="modal" id="dayModal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mday">
    <h2 class="mday" id="mday">—</h2>
    <p class="mdate" id="mdate"></p>
    <div id="mbody"></div>
    <span class="mhint">Tap anywhere to close</span>
  </div>
</div>

<!-- Your existing data files, read as they are. Nothing here changes them. -->
<script src="lunch.js"></script>
<script src="calendar.js"></script>

<script>
/* ===========================================================================
   OUR CALENDAR
   ---------------------------------------------------------------------------
   A month the class can touch. Tap any day to see that day's lunch, read out
   loud, in type big enough for the back of the room.

   It reads the same two files the morning board uses — lunch.js and
   calendar.js — so there is one place to edit a menu or a day off, not two.
   If either file is missing the calendar still works; the corner says which.
   =========================================================================== */

const DAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];

let view = new Date();          // which month is on screen
let soundOn = true;
let missing = [];

/* ---------- shared parsing (same formats as the board) ---------- */
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(field); field=''; }
    else if (c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if (c!=='\r') field+=c;
  }
  if (field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function parseDate(s){
  const m=String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  const d=new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d)?null:d;
}
const DAYMAP={su:0,sun:0,sunday:0,m:1,mo:1,mon:1,monday:1,tu:2,tue:2,tues:2,tuesday:2,
  w:3,we:3,wed:3,wednesday:3,th:4,thu:4,thur:4,thurs:4,thursday:4,
  f:5,fr:5,fri:5,friday:5,sa:6,sat:6,saturday:6};

/* lunch.js keeps the menu inside backticks */
function menuTextFrom(raw){
  const m=String(raw).match(/window\.LUNCH_MENU\s*=\s*`([\s\S]*?)`\s*;/);
  return m?m[1]:raw;
}
let LUNCH_DATE={}, LUNCH_DOW={}, LUNCH_DEFAULT='';
function parseLunch(text){
  LUNCH_DATE={}; LUNCH_DOW={}; LUNCH_DEFAULT='';
  parseCSV(text).forEach(cells=>{
    const c=cells.map(x=>x.trim());
    if (!c.join('').trim() || c[0].charAt(0)==='#') return;
    const menu=c.slice(1).filter(x=>x).join(', ');
    if (!menu) return;
    const k=c[0].toLowerCase();
    if (k==='default'){ LUNCH_DEFAULT=menu; return; }
    const d=parseDate(c[0]);
    if (d){ LUNCH_DATE[key(d)]=menu; return; }
    const wd=DAYMAP[k];
    if (wd!==undefined) LUNCH_DOW[wd]=menu;
  });
}
function lunchFor(d){
  return LUNCH_DATE[key(d)] || LUNCH_DOW[d.getDay()] || LUNCH_DEFAULT || '';
}
function lunchIsReal(d){
  return !!(LUNCH_DATE[key(d)] || LUNCH_DOW[d.getDay()] !== undefined);
}

let YEAR_START=null, YEAR_END=null, CLOSURES=[];
function parseSchoolCalendar(text){
  YEAR_START=YEAR_END=null; CLOSURES=[];
  parseCSV(text).forEach(cells=>{
    const c=cells.map(x=>x.trim());
    if (!c.join('').trim() || c[0].charAt(0)==='#') return;
    const k=c[0].toLowerCase();
    if (k==='first day'||k==='last day'){
      const d=parseDate(c[1]); if(!d) return;
      if (k==='first day') YEAR_START=d; else YEAR_END=d;
    } else if (k==='no school'){
      const parts=String(c[1]||'').split(/\s+to\s+/i);
      const from=parseDate(parts[0]);
      const to=parts[1]?parseDate(parts[1]):from;
      if (from&&to) CLOSURES.push({from,to,label:c[2]||'No school'});
    }
  });
}
function closureFor(d){
  if (d.getDay()===0||d.getDay()===6) return 'Weekend';
  if (YEAR_START && d<YEAR_START) return 'Summer break';
  if (YEAR_END && d>YEAR_END) return 'Summer break';
  const t=d.getTime();
  for (const c of CLOSURES)
    if (t>=c.from.getTime() && t<=c.to.getTime()+82800000) return c.label;
  return null;
}

/* ---------- sound ---------- */
let audio=null;
function ac(){ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
  if (audio.state==='suspended') audio.resume(); return audio; }
function speak(t){
  if (!soundOn || !t || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=0.8; speechSynthesis.speak(u); }catch(e){}
}
const ICON_ON='<path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.9 8.9 0 0 0 0-17.6z"/>';
const ICON_OFF='<path d="M4 9v6h4l5 4V5L8 9H4zm15.5 3 2.3-2.3-1.4-1.4L18 10.6l-2.3-2.3-1.4 1.4 2.3 2.3-2.3 2.3 1.4 1.4 2.3-2.3 2.4 2.3 1.4-1.4-2.3-2.3z"/>';
function paintSound(){
  document.getElementById('soundIcon').innerHTML = soundOn?ICON_ON:ICON_OFF;
  document.getElementById('soundLabel').textContent = soundOn?'Sound on':'Sound off';
  document.getElementById('soundBtn').setAttribute('aria-pressed', String(!soundOn));
  checkWake();
}
document.getElementById('soundBtn').addEventListener('click',()=>{
  soundOn=!soundOn;
  try{ localStorage.setItem('calendar:sound', JSON.stringify(soundOn)); }catch(e){}
  paintSound();
});
function checkWake(){
  const el=document.getElementById('wake'); let blocked=false;
  try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); blocked=audio.state!=='running'; }
  catch(e){ blocked=false; }
  el.hidden = !blocked || !soundOn;
}
function wakeUp(){
  try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); }catch(e){}
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
  setTimeout(checkWake,400);
}
document.addEventListener('pointerdown', wakeUp);
setInterval(checkWake, 5000);

/* ---------- drawing the month ---------- */
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function render(){
  document.getElementById('monthName').textContent = MONTHS[view.getMonth()] + ' ' + view.getFullYear();

  const dow=document.getElementById('dow');
  if (!dow.children.length) SHORT.forEach(s=>{ const e=document.createElement('span'); e.textContent=s; dow.appendChild(e); });

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const first=new Date(view.getFullYear(), view.getMonth(), 1);
  const lead=first.getDay();
  const days=new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const cells=Math.ceil((lead+days)/7)*7;
  grid.style.gridTemplateRows='repeat('+(cells/7)+',minmax(0,1fr))';
  const today=new Date();

  for (let i=0;i<cells;i++){
    const n=i-lead+1;
    if (n<1 || n>days){
      const b=document.createElement('div'); b.className='cell blank'; grid.appendChild(b); continue;
    }
    const d=new Date(view.getFullYear(), view.getMonth(), n);
    const closed=closureFor(d);
    const weekend=(d.getDay()===0||d.getDay()===6);

    const b=document.createElement('button');
    b.className='cell' + (weekend?' weekend':'') + (closed&&!weekend?' closed':'') + (sameDay(d,today)?' today':'');
    b.dataset.date=key(d);

    const num=document.createElement('span'); num.className='dnum'; num.textContent=n;
    b.appendChild(num);

    if (closed && !weekend){
      const t=document.createElement('span'); t.className='tag'; t.textContent=closed; b.appendChild(t);
    } else if (!weekend){
      /* only a real dated or weekday menu earns a spot in the grid — the
         default line would otherwise print on every empty day */
      const menu = lunchIsReal(d) ? lunchFor(d) : '';
      if (menu){
        const pip=document.createElement('span'); pip.className='pip';
        pip.textContent='\u{1F37D}\u{FE0F}'; pip.setAttribute('aria-hidden','true');
        const m=document.createElement('span'); m.className='meal';
        m.textContent=menu.split(',')[0].trim();
        b.append(pip, m);
      }
    }
    b.setAttribute('aria-label', DAYS[d.getDay()]+' '+MONTHS[d.getMonth()]+' '+n);
    b.addEventListener('click', ()=>openDay(d));
    grid.appendChild(b);
  }
}

/* ---------- the day card ---------- */
let closeTimer=null;
function openDay(d){
  document.getElementById('mday').textContent = DAYS[d.getDay()];
  document.getElementById('mdate').textContent = MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  const body=document.getElementById('mbody');
  body.innerHTML='';

  const closed=closureFor(d);
  let say = DAYS[d.getDay()] + '. ';

  if (closed){
    const c=document.createElement('div'); c.className='mclosed';
    c.textContent = closed==='Weekend' ? 'No school today' : 'No school — ' + closed;
    body.appendChild(c);
    say += (closed==='Weekend' ? 'No school.' : 'No school. ' + closed + '.');
  } else {
    const menu=lunchFor(d);
    const label=document.createElement('p'); label.className='mlabel';
    label.innerHTML='<span aria-hidden="true">\u{1F37D}\u{FE0F}</span><span>Lunch</span>';
    body.appendChild(label);
    if (menu){
      const ul=document.createElement('ul'); ul.className='mlist';
      const items=menu.split(',').map(x=>x.trim()).filter(x=>x);
      items.forEach(it=>{ const li=document.createElement('li'); li.textContent=it; ul.appendChild(li); });
      ul.classList.toggle('two', items.length>5);
      ul.classList.toggle('dense', items.length>5);
      body.appendChild(ul);
      say += 'Lunch is ' + menu + '.';
    } else {
      const p=document.createElement('p'); p.className='mnone';
      p.textContent='No menu for this day yet.';
      body.appendChild(p);
      say += 'There is no menu for this day yet.';
    }
  }

  document.getElementById('dayModal').hidden=false;
  speak(say);
  clearTimeout(closeTimer);
  closeTimer=setTimeout(closeDay, 30000);
}
function closeDay(){ document.getElementById('dayModal').hidden=true; clearTimeout(closeTimer); }
document.getElementById('dayModal').addEventListener('click', closeDay);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDay(); });

/* ---------- month navigation ---------- */
document.getElementById('prev').addEventListener('click', ()=>{ view=new Date(view.getFullYear(), view.getMonth()-1, 1); render(); });
document.getElementById('next').addEventListener('click', ()=>{ view=new Date(view.getFullYear(), view.getMonth()+1, 1); render(); });
document.getElementById('todayBtn').addEventListener('click', ()=>{ view=new Date(); render(); });

/* ---------- what did we manage to read? ---------- */
function paintStatus(){
  const el=document.getElementById('status');
  if (missing.length){
    el.textContent='NOT FOUND: '+missing.join(', ')+
      '  —  put this page in the same folder as the morning board';
    el.className='status warn';
  } else {
    const n=Object.keys(LUNCH_DATE).length;
    el.textContent='reading lunch.js ('+n+' dated menus) and '+calSource+' ('+CLOSURES.length+' days off)';
    el.className='status';
  }
}

/* ---------- finding the school calendar ----------
   The single-file morning board keeps its school year INSIDE itself rather
   than in a calendar.js. So: use calendar.js if there is one, otherwise read
   the block straight out of the board. That way the year is edited in one
   place, wherever you happen to keep it, and never in two.             */
const BOARD_FILE = 'class-board-single.html';

function calendarFromBoard(){
  if (location.protocol === 'file:') return Promise.resolve(false);   // fetch is blocked here
  return fetch(BOARD_FILE + '?t=' + Date.now(), { cache:'no-store' })
    .then(r => r.ok ? r.text() : '')
    .then(txt => {
      const m = txt.match(/window\.SCHOOL_CALENDAR\s*=\s*`([\s\S]*?)`\s*;/);
      if (!m) return false;
      parseSchoolCalendar(m[1]);
      calSource = BOARD_FILE;
      return true;
    })
    .catch(() => false);
}

/* ---------- start ---------- */
let calSource = '';
if (typeof window.LUNCH_MENU === 'string') parseLunch(menuTextFrom(window.LUNCH_MENU));
else missing.push('lunch.js');

if (typeof window.SCHOOL_CALENDAR === 'string'){
  parseSchoolCalendar(window.SCHOOL_CALENDAR);
  calSource = 'calendar.js';
}

try{ const v=localStorage.getItem('calendar:sound'); if(v!==null) soundOn=JSON.parse(v); }catch(e){}
paintSound();
render();
paintStatus();
checkWake();

/* no calendar.js? go and look inside the board instead */
if (!calSource){
  calendarFromBoard().then(found => {
    if (!found) missing.push('calendar.js');
    render(); paintStatus();
  });
}

/* if the board is left running overnight, move the highlight along */
let shownDay = key(new Date());
setInterval(()=>{
  const k=key(new Date());
  if (k!==shownDay){ shownDay=k; render(); }
}, 60000);

window.addEventListener('message', e => {
  if (!e.data || e.data.mm !== 'hidden') return;
  closeDay();
  try { speechSynthesis.cancel(); } catch(err){}
});
</script>
</body>
</html>
